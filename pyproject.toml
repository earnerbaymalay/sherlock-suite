[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sherlock-suite"
version = "1.0.0"
description = "Defensive OSINT & Attack Surface Management Suite with Textual TUI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual>=0.70.0",
    "httpx>=0.27.0",
    "dnspython>=2.6.0",
    "pydantic>=2.7.0",
    "rich>=13.7.0",
    "phonenumbers>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
sherlock = "sherlock.cli:main"

[tool.setuptools.packages.find]
include = ["sherlock*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
